<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course Dashboard Demo</title>

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111417;
  color: #f7f7f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.top {
  height: 85px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 22px 22px 0;
}

.hamb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: #e7e7e7;
  font-size: 30px;
  cursor: pointer;
  padding: 8px 12px 8px 0;
}

.top h1 {
  font-size: 24px;
  font-weight: 650;
  margin: 0;
}

.sub {
  color: #92989f;
  margin: 8px 22px 26px;
}

.heading {
  font-size: 21px;
  margin: 30px 22px 16px;
}

.course {
  margin: 13px 20px;
  background: #202327;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  min-height: 120px;
}

.tile {
  width: 110px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: 650;
}

.detail { padding: 22px 17px; }
.detail strong { font-size: 19px; }
.detail p { margin: 8px 0 0; color: #aab0b6; }

.navbottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #181b1e;
  border-top: 1px solid #2d3033;
  display: flex;
  justify-content: space-around;
  padding: 15px 10px max(17px, env(safe-area-inset-bottom));
  color: #aab0b6;
}

.navbottom span:first-child { color: #de4b4b; }

#menu-toggle {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* Keep the overlay rendered while the closing animation finishes. */
.overlay {
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 4;
  visibility: hidden;
  pointer-events: none;
  transition:
    background-color 650ms cubic-bezier(.4, 0, .2, 1),
    visibility 0s linear 650ms;
}

#menu-toggle:checked ~ .overlay {
  background: #0009;
  visibility: visible;
  pointer-events: auto;
  transition-delay: 0s;
}

/* The same transition runs smoothly in both directions. */
.drawer {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: min(75vw, 380px);
  background: #1c1c1e;
  box-shadow: 6px 0 20px #0004;
  overflow-y: auto;
  transform: translate3d(-110%, 0, 0);
  will-change: transform;
  transition: transform 650ms cubic-bezier(.4, 0, .2, 1);
}

#menu-toggle:checked ~ .overlay .drawer {
  transform: translate3d(0, 0, 0);
}

.profile {
  padding: 110px 24px 30px;
  border-bottom: 1px solid #303033;
}

.avatar {
  height: 88px;
  width: 88px;
  border: 1.5px solid #606b73;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #121618;
  color: #858d94;
  font-size: 34px;
  margin-bottom: 18px;
}

.name {
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -.4px;
}

.email {
  font-size: 17px;
  color: #929ba4;
  margin-top: 4px;
  overflow-wrap: anywhere;
}

.menu {
  padding: 12px 0;
  border-bottom: 1px solid #303033;
}

.menu button {
  height: 67px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 25px;
  padding: 0 24px;
  color: white;
  background: none;
  border: 0;
  text-align: left;
  font-size: 21px;
  cursor: pointer;
}

.menu .ico {
  font-size: 26px;
  width: 31px;
  text-align: center;
}

.version {
  position: absolute;
  bottom: 65px;
  left: 20px;
  color: #92989f;
  font-size: 17px;
}

.dot {
  position: fixed;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  height: 7px;
  width: 7px;
  border-radius: 50%;
  background: #db3030;
  z-index: 10;
}

.closearea {
  position: absolute;
  left: min(75vw, 380px);
  right: 0;
  top: 0;
  bottom: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.page { display: none; padding: 20px; }
.page.active { display: block; }

.back {
  background: none;
  border: 0;
  color: white;
  font-size: 18px;
  margin-bottom: 20px;
  cursor: pointer;
}

/* Respect the iPhone's Reduce Motion accessibility setting. */
@media (prefers-reduced-motion: reduce) {
  .overlay, .drawer { transition: none; }
}
</style>
</head>

<body>
<input type="checkbox"
       id="menu-toggle"
       aria-label="Toggle navigation menu">

<main id="dashboard">
  <header class="top">
    <label class="hamb"
           for="menu-toggle"
           role="button"
           aria-label="Open menu">☰</label>
    <h1>Dashboard</h1>
  </header>

  <p class="sub">Good afternoon</p>
  <h2 class="heading">Courses (4)</h2>

  <section class="course">
    <div class="tile" style="background:#17637a">BIO</div>
    <div class="detail">
      <strong>Biology 101</strong>
      <p>Course</p>
    </div>
  </section>

  <section class="course">
    <div class="tile" style="background:#17664e">MKT</div>
    <div class="detail">
      <strong>Marketing</strong>
      <p>Course</p>
    </div>
  </section>

  <section class="course">
    <div class="tile" style="background:#775c24">TRIG</div>
    <div class="detail">
      <strong>Trig</strong>
      <p>Course</p>
    </div>
  </section>

  <section class="course">
    <div class="tile" style="background:#573e79">EX</div>
    <div class="detail">
      <strong>Exercise Science</strong>
      <p>Course</p>
    </div>
  </section>
</main>

<section class="page" id="other">
  <button class="back" id="back">‹ Dashboard</button>
  <h2 id="pagetitle"></h2>
</section>

<div class="navbottom">
  <span>◉ Dashboard</span>
  <span>▤ Calendar</span>
  <span>☷ To Do</span>
  <span>▣ Inbox</span>
</div>

<div class="overlay" id="overlay">
  <aside class="drawer"
         role="dialog"
         aria-label="Navigation menu">
    <div class="profile">
      <div class="avatar">BM</div>
      <div class="name">Brian Matar</div>
      <div class="email">bmatar@ku.edu</div>
    </div>

    <div class="menu">
      <button data-page="Files">
        <span class="ico">▱</span>Files
      </button>
      <button data-page="Settings">
        <span class="ico">⚙</span>Settings
      </button>
    </div>

    <div class="menu">
      <button data-page="Help">
        <span class="ico">ⓘ</span>Help
      </button>
      <button data-page="Change User">
        <span class="ico">♙</span>Change User
      </button>
      <button data-page="Log Out">
        <span class="ico">⇥</span>Log Out
      </button>
    </div>

    <div class="version">Demo</div>
  </aside>

  <label class="closearea"
         for="menu-toggle"
         aria-label="Close menu"></label>
</div>

<span class="dot" title="Demo indicator"></span>

<script>
(function () {
  var check = document.getElementById("menu-toggle");
  var dashboard = document.getElementById("dashboard");
  var other = document.getElementById("other");

  document.querySelectorAll("[data-page]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      check.checked = false;
      dashboard.style.display = "none";
      other.classList.add("active");
      document.getElementById("pagetitle").textContent =
        btn.getAttribute("data-page");
    });
  });

  document.getElementById("back").addEventListener("click", function () {
    other.classList.remove("active");
    dashboard.style.display = "block";
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      check.checked = false;
    }
  });
})();
</script>
</body>
</html>
